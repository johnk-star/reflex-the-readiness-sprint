<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Dashboard | Reflex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Reflex</h1>
        <p>Retailer Delivery Request</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Create Delivery Request</h2>

            <form id="deliveryForm">

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="customerPhone">Customer Phone</label>
                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="0712345678"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <input
                        type="text"
                        id="address"
                        placeholder="Enter delivery address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productId">Product</label>

                    <select id="productId" required>
                        <option value="">
                            Select a product
                        </option>

                        <option value="1">
                            iPhone 17 Pro Max - 256GB
                        </option>

                        <option value="2">
                            iPhone 17 Pro Max - 512GB
                        </option>

                        <option value="3">
                            Laptop - 13-inch
                        </option>

                        <option value="4">
                            Laptop - 15-inch
                        </option>

                        <option value="5">
                            Laptop - 17-inch
                        </option>

                        <option value="6">
                            Laptop Backpack - Standard
                        </option>

                        <option value="7">
                            Laptop Backpack - Large
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>

                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        value="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="itemDescription">
                        Item Description
                    </label>

                    <textarea
                        id="itemDescription"
                        placeholder="Describe the item"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Create Delivery
                </button>

            </form>

            <p id="message"></p>

        </section>

        <section class="link-section">
            <p>
                Dispatcher?
                <a href="dispatcher.html">
                    Go to Dispatcher Dashboard
                </a>
            </p>
        </section>

    </main>

    <script src="../js/app.js"></script>

</body>
</html>
